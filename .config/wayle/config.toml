[bar]
background-opacity = 85
scale = 0.72
padding = 0.2
padding-ends = 0.35
module-gap = 0.35
bg = "bg-base"
button-icon-padding = 0.9
button-icon-size = 0.9
button-label-size = 0.95
dropdown-autohide = true
dropdown-freeze-label = false
dropdown-opacity = 98
rounding = "none"
shadow = "none"

[general]
font-sans = "Ubuntu Sans"

[[bar.layout]]
monitor = "*"
left = [{ name = "group", modules = ["dashboard", "clock"] }, "hyprland-workspaces", "cava"]
center = ["window-title"]
right = ["systray", "custom-mongodb", "hyprsunset", { name = "resources", modules = ["cpu", "ram"] }, { name = "connectivity", modules = ["bluetooth", "network"] }, { name = "controls", modules = ["volume", "custom-brightness"] }, "notifications"]

[modules.dashboard]
right-click = "wayle panel settings"

[modules.clock]
format = "%H:%M"
border-show = true
dropdown-show-seconds = true
icon-show = false

[modules.hyprland-workspaces]
display-mode = "label"
numbering = "absolute"
min-workspace-count = 2
monitor-specific = false
show-special = false
app-icons-show = true
app-icons-dedupe = false
divider = " "
icon-size = 0.9

[modules.cpu]
format = "{{ percent }}"

[modules.systray]
icon-scale = 0.85
item-gap = 0.4
blacklist = ["*blueman*", "*bluetooth*"]

[modules.window-title]
label-max-length = 60

[modules.bluetooth]
label-show = false

[modules.weather]
location = "Somerset West"
units = "metric"
format = "{{ temp }}{{ temp_unit }}"

[modules.volume]
format = "{{ percent }}%"

[modules.cava]
bars = 12
button-bg-color = "transparent"
framerate = 15
high-cutoff = 15000
noise-reduction = 0.2

[modules.hyprsunset]
label-show = false

[modules.network]
label-show = false

[modules.notifications]
label-show = false
popup-duration = 3000

# Monitor brightness over DDC/CI, replacing the old brightnessctl module.
# brightnessctl drives an internal laptop panel backlight through
# /sys/class/backlight; this machine has no internal panel, so that module was
# dead here (and was not even in the layout). The script talks to both Dells
# over I2C instead. It reads from a cache rather than calling ddcutil, because
# ddcutil costs ~1s per call and would stall the bar on every poll, so the
# interval below is cheap no matter how short it is.
#
# watch mode, not poll. Brightness is driven from three places: this module's
# scroll, its click, and the MX Keys keys via a Solaar rule. wayle only knows
# about the first two, so `on-action` could never see a keypress and the label
# sat stale until the next poll, which is what made it look like it took forever
# to catch up. Polling faster would work but burns a process every interval
# forever. brightness-watch.sh blocks on inotify against the state file instead
# and prints the moment any of the three writes it, so the label is immediate and
# idle cost is zero.
[[modules.custom]]
id = "brightness"
command = "~/.config/wayle/scripts/brightness-watch.sh"
mode = "watch"
restart-policy = "on-failure"
format = "{{ percentage }}%"
icon-show = true
icon-name = "ld-sun-symbolic"
# The whole point of icon-map here. The click below flips the panels' ambient
# light sensor for real, but the percentage does not move when it does, so with
# a static icon both states of the toggle looked identical and the button read
# as dead. The watch script emits alt=auto|manual and the icon follows it.
icon-map = { auto = "ld-sun-moon-symbolic", manual = "ld-sun-symbolic" }
scroll-up = "~/.config/wayle/scripts/brightness.sh up"
scroll-down = "~/.config/wayle/scripts/brightness.sh down"
# Left-click toggles the panels' ambient light sensor (VCP 0x66). The sensor
# overwrites brightness continuously while it is on, so scrolling turns it off
# automatically; this is how you turn it back on.
left-click = "~/.config/wayle/scripts/brightness.sh auto"
tooltip-format = "Monitor brightness {{ percentage }}% (both panels, DDC/CI), auto-brightness {{ alt }}. Scroll to adjust, click to toggle auto-brightness."

[[modules.custom]]
id = "mongodb"
command = "~/.config/wayle/scripts/mongodb-status.sh"
interval-ms = 5000
format = "{{ text }}"
tooltip-format = "{{ tooltip }}"
icon-show = true
icon-name = "ld-leaf-symbolic"
left-click = "sh -c ~/.config/wayle/scripts/mongodb-toggle.sh"

[osd]
border = false
duration = 800
margin = 0.0

[wallpaper]
engine-enabled = true
cycling-enabled = true
cycling-directory = "/home/francois/dotfiles/resources/"
cycling-mode = "sequential"
cycling-interval-mins = 60
cycling-same-image = true

[styling.palette]
bg = "#1d2021"
blue = "#83a598"
elevated = "#3c3836"
fg = "#ebdbb2"
fg-muted = "#a89984"
green = "#b8bb26"
primary = "#8ec07c"
red = "#fb4934"
surface = "#282828"
yellow = "#fabd2f"
