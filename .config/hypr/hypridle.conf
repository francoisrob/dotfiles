# Hyprland 0.56 made `hyprctl dispatch` a Lua call: the argument is evaluated as
# `return hl.dispatch(<arg>)`, so the old bare `dispatch dpms off` is a Lua syntax
# error and silently does nothing. The dispatcher now lives at hl.dsp.dpms(state
# [, output]).
general {
    lock_cmd = pgrep hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session $XDG_SESSION_ID
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# on-resume carries the SAME `pidof hyprlock` gate as on-timeout, and must.
# hypridle fires on-resume whenever this rule's timeout has elapsed, regardless
# of whether the on-timeout command actually did anything. Unlocked, on-timeout
# short-circuits on pidof and blanks nothing, so an ungated on-resume ran
# dpms("on") against two already-on outputs every time you idled 30s and came
# back. Hyprland re-enables an already-enabled output with a full modeset, which
# drops and re-trains the DP link: ~1s of black on both panels, several times an
# hour. Locked, hyprlock is still running while you type the password, so the
# gate is true and the screens come back exactly as before.
listener {
    timeout = 30
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 15000
    on-timeout = /run/current-system/sw/bin/brightnessctl -s set 10
    on-resume = /run/current-system/sw/bin/brightnessctl -r
}

listener {
    timeout = 60000
    on-timeout = /run/current-system/sw/bin/brightnessctl -sd dell::kbd_backlight set 0
    on-resume = /run/current-system/sw/bin/brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 90000
    on-timeout = loginctl lock-session $XDG_SESSION_ID
}

listener {
    timeout = 93000
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 180000
    on-timeout = systemctl suspend
}
