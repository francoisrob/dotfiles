background {
    path = /home/francois/dotfiles/resources/mountains.png
    color = rgba(40, 40, 40, 1.0)
}

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

input-field {
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    font_color = rgba(235, 219, 178, 0.75)
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(254, 128, 25)
    placeholder_text = <i><span foreground="##ebdbb2">Input Password...</span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

label {
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(235, 219, 178, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

label {
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba(235, 219, 178, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}

