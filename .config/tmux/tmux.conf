# Set the default terminal mode
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'

# Fast input and focus handling for Neovim
set -g escape-time 0
set -g focus-events on
set -g assume-paste-time 0

# Extended keys support
set -s extended-keys on
set-window-option -g xterm-keys on

# Prefix Key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Splits
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload Config Menu
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Pane Resizing
bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 3
bind -r h resize-pane -L 3

# Maximize Pane
bind -r m resize-pane -Z

# Mouse & Clipboard
set -g mouse on
set -g alternate-screen on
set -g set-clipboard on

# Window & Pane Indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Status Bar
set -g status-position top
set -g status-interval 5

# Gruvbox Dark (medium), accented with the same aqua (#8ec07c) as hyprland,
# kitty, wayle, Kvantum and GTK. Only colors are set here: the layout is left as
# tmux's default so the bar keeps showing what it showed before.
#
# Written out instead of using egel/tmux-gruvbox, which was declared below but
# never installed. That plugin hardcodes yellow (#fabd2f) for the active window
# with no option to change it, so it would have to be fought rather than
# configured; it also needs a manual `prefix + I`, and TPM is sourced at the
# bottom of this file, so it would silently override anything set up here.
set -g status-style "bg=#3c3836,fg=#ebdbb2"
setw -g window-status-current-style "bg=#8ec07c,fg=#282828,bold"
setw -g window-status-style "fg=#a89984"
setw -g window-status-activity-style "fg=#fabd2f,none"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#8ec07c"
set -g message-style "bg=#8ec07c,fg=#282828"
set -g message-command-style "bg=#504945,fg=#ebdbb2"
setw -g mode-style "bg=#8ec07c,fg=#282828"
set -g clock-mode-colour "#8ec07c"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Smart pane switching with awareness of Vim splits
set -g @plugin 'christoomey/vim-tmux-navigator'
# Better clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (TPM) (Keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
