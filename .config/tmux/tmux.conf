set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'

set -g escape-time 0
set -g focus-events on
set -g assume-paste-time 0

set -s extended-keys on
set-window-option -g xterm-keys on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 3
bind -r h resize-pane -L 3

bind -r m resize-pane -Z

set -g mouse on
set -g alternate-screen on
set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g status-position top
set -g status-interval 5

set -g status-style "bg=#3c3836,fg=#ebdbb2"
setw -g window-status-current-style "bg=#8ec07c,fg=#282828,bold"
setw -g window-status-style "fg=#a89984"
setw -g window-status-activity-style "fg=#fabd2f,none"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#8ec07c"
set -g message-style "bg=#8ec07c,fg=#282828"
set -g message-command-style "bg=#504945,fg=#ebdbb2"
setw -g mode-style "bg=#8ec07c,fg=#282828"
set -g clock-mode-colour "#8ec07c"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'
