# vo defaults to gpu-next since mpv 0.41 and gpu-api stays on auto: forcing
# vulkan hits open gpu-next+vulkan amdgpu bugs (mpv#13811, out-of-order frames
# under load), so opengl-on-auto is the stable choice on the 890M.
profile=high-quality
hwdec=auto-safe

keep-open=yes
save-position-on-quit=yes

# uosc draws its own seekbar, volume and window controls; the built-in ones
# would render underneath it.
osc=no
osd-bar=no
border=no
