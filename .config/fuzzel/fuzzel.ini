# fuzzel, replacing hyprlauncher.
#
# hyprlauncher 0.1.6 exposes eleven config options and not one is cosmetic: no
# font, no colours, no padding, no rounding, no icon size. It renders straight to
# Cairo/Pango with no GTK and no stylesheet hook, so its appearance is hardcoded
# in the binary and cannot be themed at all. fuzzel is native Wayland, starts as
# fast, and is fully themeable.
#
# The other reason for the swap is in modules/system/boot.nix: "hyprlauncher puts
# everything it launches in one shared scope, so a pressure kill there takes out
# slack, spotify and thunar together". launch-prefix below routes every launch
# through uwsm-app, so each app lands in its own systemd scope and an oomd kill
# can only take the one app with it.

# uwsm-app gives each launched app its own app-*.scope instead of letting it
# inherit the launcher's. Matches how the Super+E chromium bind already launches.
launch-prefix=uwsm-app --

# Ubuntu Sans has no icon glyphs, so JetBrainsMono Nerd Font is listed as a
# fallback purely to render the magnifier in `prompt` below. fuzzel takes a
# comma separated fontconfig list and only reaches the fallback for codepoints
# the first font lacks, so every letter still renders in Ubuntu Sans.
font=Ubuntu Sans:size=13,JetBrainsMono Nerd Font:size=15
dpi-aware=no

# Bold is used for the selected entry only, so the current row is legible as
# the current row even before you notice the highlight behind it.
use-bold=yes

# fuzzel cannot draw a box or a rule around its input, so the search line is
# whatever these two make it: a magnifier (U+F0349) instead of the default
# "> ", and grey placeholder text instead of an empty line. Quoted so the
# trailing space survives.
prompt="󰍉  "
placeholder=Search apps

# Same icon theme as GTK and Thunar use, from home-manager/default.nix:166
# (pkgs.gruvbox-plus-icons with folder-color = "green"). It lives in the
# home-manager profile, ~/.nix-profile/share/icons, rather than the system path.
icon-theme=Gruvbox-Plus-Dark
icons-enabled=yes

# When a query narrows to one or two matches, fuzzel by default replaces the
# list with a single icon blown up to half the window (image-size-ratio=0.5).
# In a launcher this compact it reads as a rendering fault, so 1 turns it off
# and the last matches keep the normal row layout.
image-size-ratio=1

lines=12
width=45

# Spacing, tuned compact: tight gaps, just enough that nothing touches.
#
# fuzzel has no per-row padding, so line-height is a row's entire height and the
# icon is scaled to fill it. 28 puts ~5px above and below the 17px text instead
# of the 26 that had glyphs and icons running into the row edges.
line-height=28

# horizontal-pad and vertical-pad are border-to-content; inner-pad is the gap
# between the search line and the list. Kept deliberately small: 16/10 hugs the
# content rather than framing it, and inner-pad=8 is enough to read the search
# line as its own thing without opening a gutter under it.
horizontal-pad=16
vertical-pad=10
inner-pad=8

# Without this the window is always 12 rows tall, so a two-match query leaves
# ten blank rows of dead background. Set to no if the window resizing as you
# type is more annoying than the empty space was.
minimal-lines=yes

# Gruvbox, matching [styling.palette] in .config/wayle/config.toml so the
# launcher and the bar read as one system. Format is RRGGBBAA.
#
# Every colour key fuzzel has is set here on purpose: an unset key falls back to
# fuzzel's Solarized LIGHT default, which is why the prompt and the text you
# typed used to render in muted blue-grey (586e75 / 657b83) on a dark panel.
[colors]
background=1d2021f5
text=ebdbb2ff
match=8ec07cff
selection=3c3836ff
selection-text=fabd2fff
selection-match=8ec07cff
border=8ec07cff
prompt=8ec07cff
input=ebdbb2ff
placeholder=665c54ff
counter=928374ff
message=a89984ff

# Matched to the hyprland window frame in .config/hypr/hyprland.lua:
# general.border_size = 1 and decoration.rounding = 5, so the launcher reads as
# one more window on the desktop instead of a rounder floating pill.
[border]
width=1
radius=5
# The selected row was a hard-edged block inside a rounded window. Same radius
# as the window so the two curves agree.
selection-radius=5
